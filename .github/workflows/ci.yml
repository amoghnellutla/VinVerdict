name: CI

# Every push and pull request: lint, type-check, the offline test suite
# (including the listing accuracy scorecard), a production build and a
# dependency audit. No API keys are needed: tests never call paid APIs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        # PageProps/LayoutProps are generated by Next.js, so generate them first on a fresh checkout.
        run: npx next typegen && npx tsc --noEmit
      - name: Tests and accuracy scorecard
        run: npm test
      - name: Production build
        # Placeholders, not real settings: pages create a Supabase client while
        # pre-rendering, but nothing connects to it during the build.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-public-key
        run: npm run build
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
